name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest claude-agent-sdk dulwich keyring platformdirs
      - run: pytest -q
      - name: Numéros de version alignés sur l'étiquette
        run: |
          attendu="${GITHUB_REF_NAME#v}"
          python3 - "$attendu" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          trouves = {
            "plugin": json.load(open(".claude-plugin/plugin.json"))["version"],
            "app": json.load(open("app/src-tauri/tauri.conf.json"))["version"],
            "package": json.load(open("app/package.json"))["version"],
            "cargo": re.search(r'^version = "([^"]+)"', open("app/src-tauri/Cargo.toml").read(), re.M).group(1),
            "moteur": re.search(r'__version__ = "([^"]+)"', open("referentiel/__init__.py").read()).group(1),
          }
          faux = {k: x for k, x in trouves.items() if x != v}
          if faux:
              sys.exit(f"Étiquette {v}, mais : {faux}")
          PY

  preparer:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.creer.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: creer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python3 - <<'PY'
          import os, re
          v = os.environ["GITHUB_REF_NAME"][1:]
          texte = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## {re.escape(v)}[^\n]*\n(.*?)(?=\n## |\Z)", texte, re.S)
          print(m.group(1).strip() if m else "")
          PY
          )
          gh release create "$GITHUB_REF_NAME" --draft --title "Watson $GITHUB_REF_NAME" --notes "$notes"
          echo "release=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  application:
    needs: preparer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cible: aarch64-apple-darwin
          # Mac Intel : construit sur un Mac Apple Silicon (les machines Intel de GitHub ne sont plus attribuées),
          # avec un Python x64 exécuté par Rosetta pour le moteur.
          - os: macos-14
            cible: x86_64-apple-darwin
            python: x64
          - os: windows-latest
            cible: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python || '' }}
      - name: Moteur (Python embarqué)
        env:
          WATSON_CIBLE: ${{ matrix.cible }}
        run: |
          pip install pyinstaller dulwich keyring platformdirs claude-agent-sdk
          python scripts/construire_moteur.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          releaseId: ${{ needs.preparer.outputs.release }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.cible }}

  finaliser:
    # Publie même si une plateforme a échoué : les autres restent disponibles.
    needs: [preparer, application]
    if: ${{ !cancelled() && needs.preparer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin Claude, empreintes et publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/construire_plugin.py
          gh release upload "$GITHUB_REF_NAME" dist/*.plugin
          mkdir -p empreintes && cd empreintes
          gh release download "$GITHUB_REF_NAME" --pattern "*.tar.gz" --pattern "*.exe" --pattern "*.dmg" --pattern "*.plugin"
          sha256sum * > ../SHA256SUMS && cd ..
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
