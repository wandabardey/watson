name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest claude-agent-sdk dulwich keyring platformdirs pypdf pillow python-pptx
      - run: pytest -q
      - name: Numéros de version alignés sur l'étiquette
        run: |
          attendu="${GITHUB_REF_NAME#v}"
          python3 - "$attendu" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          trouves = {
            "plugin": json.load(open(".claude-plugin/plugin.json"))["version"],
            "app": json.load(open("app/src-tauri/tauri.conf.json"))["version"],
            "package": json.load(open("app/package.json"))["version"],
            "cargo": re.search(r'^version = "([^"]+)"', open("app/src-tauri/Cargo.toml").read(), re.M).group(1),
            "moteur": re.search(r'__version__ = "([^"]+)"', open("referentiel/__init__.py").read()).group(1),
          }
          faux = {k: x for k, x in trouves.items() if x != v}
          if faux:
              sys.exit(f"Étiquette {v}, mais : {faux}")
          PY

  preparer:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.creer.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: creer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python3 - <<'PY'
          import os, re
          v = os.environ["GITHUB_REF_NAME"][1:]
          texte = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## {re.escape(v)}[^\n]*\n(.*?)(?=\n## |\Z)", texte, re.S)
          print(m.group(1).strip() if m else "")
          PY
          )
          gh release create "$GITHUB_REF_NAME" --draft --title "Watson $GITHUB_REF_NAME" --notes "$notes"
          echo "release=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  application:
    needs: preparer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cible: aarch64-apple-darwin
          # Mac Intel : construit sur un Mac Apple Silicon (les machines Intel de GitHub ne sont plus attribuées),
          # avec un Python x64 exécuté par Rosetta pour le moteur.
          - os: macos-14
            cible: x86_64-apple-darwin
            python: x64
          - os: windows-latest
            cible: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python || '' }}
      # Signature macOS avec une identité stable (certificat Watson, secrets WATSON_CERTIFICAT et
      # WATSON_CERTIFICAT_MDP) : le trousseau reconnaît alors chaque nouvelle version et ne redemande plus l'accès.
      # Sans ces secrets, signature sans éditeur comme avant.
      - name: Signature macOS
        if: runner.os == 'macOS'
        env:
          CERTIFICAT: ${{ secrets.WATSON_CERTIFICAT }}
          MDP: ${{ secrets.WATSON_CERTIFICAT_MDP }}
        run: |
          if [ -z "$CERTIFICAT" ]; then echo "Pas de certificat Watson : signature sans éditeur."; exit 0; fi
          trousseau="$RUNNER_TEMP/watson.keychain-db"
          mdpk=$(uuidgen)
          echo "$CERTIFICAT" | base64 --decode > "$RUNNER_TEMP/watson.p12"
          security create-keychain -p "$mdpk" "$trousseau"
          security set-keychain-settings -lut 21600 "$trousseau"
          security unlock-keychain -p "$mdpk" "$trousseau"
          security import "$RUNNER_TEMP/watson.p12" -k "$trousseau" -P "$MDP" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/watson.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$mdpk" "$trousseau" > /dev/null
          security list-keychains -d user -s "$trousseau" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Watson (4SH)" -p "$trousseau" > "$RUNNER_TEMP/watson.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/watson.pem" \
            || echo "Certificat non approuvé sur la machine de construction : la signature reste possible."
          empreinte=$(security find-identity -p codesigning "$trousseau" | awk '/Watson \(4SH\)/ {print $2; exit}')
          [ -n "$empreinte" ] || { echo "Identité Watson introuvable dans le certificat."; exit 1; }
          cp /bin/echo "$RUNNER_TEMP/essai" && codesign -f -s "$empreinte" "$RUNNER_TEMP/essai" \
            || { echo "Le certificat Watson ne permet pas de signer."; exit 1; }
          echo "WATSON_IDENTITE_SIGNATURE=$empreinte" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$empreinte" >> "$GITHUB_ENV"
      - name: Moteur (Python embarqué)
        env:
          WATSON_CIBLE: ${{ matrix.cible }}
        run: |
          pip install pyinstaller dulwich keyring platformdirs claude-agent-sdk truststore certifi pypdf pillow python-pptx
          python scripts/construire_moteur.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          releaseId: ${{ needs.preparer.outputs.release }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.cible }}
      - name: Vérifier que le moteur de l'application démarre
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            moteur="app/src-tauri/target/${{ matrix.cible }}/release/bundle/macos/Watson.app/Contents/MacOS/watson-moteur"
            codesign -dvv "$moteur" 2>&1 | head -8 || true
            codesign -d -r- "$moteur" 2>&1 | tail -1 || true
            if [ -n "$WATSON_IDENTITE_SIGNATURE" ]; then
              codesign -dvv "$moteur" 2>&1 | grep -q "Authority=Watson (4SH)" \
                || { echo "Le moteur n'est pas signé avec l'identité Watson : le trousseau redemanderait l'accès."; exit 1; }
              codesign --verify --deep --strict "$(dirname "$moteur")/../.." || echo "Attention : la vérification complète de la signature de l'application signale un écart."
            fi
          else
            moteur="app/src-tauri/target/${{ matrix.cible }}/release/watson-moteur.exe"
          fi
          export WATSON_DONNEES="$RUNNER_TEMP/watson"
          "$moteur" > moteur.log 2>&1 &
          for i in $(seq 1 60); do grep -q '^WATSON ' moteur.log && break; sleep 1; done
          cat moteur.log
          grep -q '^WATSON ' moteur.log || { echo "Le moteur ne démarre pas dans l'application construite."; exit 1; }
          kill %1 2>/dev/null || true
          "$moteur" --verifier-reseau || { echo "Le moteur de l'application n'arrive pas à joindre GitHub."; exit 1; }

  finaliser:
    # Publie même si une plateforme a échoué : les autres restent disponibles.
    needs: [preparer, application]
    if: ${{ !cancelled() && needs.preparer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin Claude, empreintes et publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/construire_plugin.py
          gh release upload "$GITHUB_REF_NAME" dist/*.plugin
          mkdir -p empreintes && cd empreintes
          gh release download "$GITHUB_REF_NAME" --pattern "*.tar.gz" --pattern "*.exe" --pattern "*.dmg" --pattern "*.plugin"
          sha256sum * > ../SHA256SUMS && cd ..
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
