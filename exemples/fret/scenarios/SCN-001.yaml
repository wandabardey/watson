id: SCN-001
nom: Annoncer et contrôler une expédition
description: De la saisie par l'expéditeur jusqu'à la prise en charge par le transporteur.
acteur: ACT-EXPEDITEUR
entite: ENT-EXPEDITION
cas_usage: [UC 04, UC 05, UC 06]
etapes:
