id: RG-006
titre: Annulation possible avant prise en charge
statut: obsolete
type: contrainte
entite: ENT-EXPEDITION
enonce: L'expéditeur peut annuler son expédition tant qu'elle n'a pas été prise en charge par le transporteur.
source: Atelier de cadrage du 2026-09-12
